<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div aria-label="Dark Mode" id="switchOut">
            <input id="switchToggle" type="checkbox" name="switchToggle">
            <span id="switchIn">
                <i class="fa-solid fa-sun"></i>
            </span>
        </div>
        <h1>Lista de Tarefas</h1>
    </header>
    <main>
        <input type="text" placeholder="Escreva uma tarefa" name="inputTask" id="inputTask">
        <button id="addTask" class="listButton">Adicionar</button>
        <button id="openListsMenu" class="listButton">
            <i class="fa-solid fa-folder"></i>
        </button>
        <div id="taskList">
            <p id="currentListTxt"></p>
        </div>
        <dialog id="masterList">
            <section>
                <h2>Escolha uma lista</h2>
                <input type="text" name="inputList" id="inputList" placeholder="Escreva o nome da lista" maxlength="20">
                <button class="addList listButton">Adicionar</button>
            </section>
        </dialog>
    </main>
    <script src="https://kit.fontawesome.com/55cafb9f96.js" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
